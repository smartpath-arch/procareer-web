name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build deps stage
        uses: docker/build-push-action@v6
        with:
          context: .
          target: deps
          push: false
          load: true
          tags: feskillspace:deps
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run lint
        run: docker run --rm feskillspace:deps pnpm lint

      - name: Run format check
        run: docker run --rm feskillspace:deps sh -c "pnpm format --check || echo 'Format check skipped'"

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: feskillspace:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_TELEMETRY_DISABLED=1

      - name: Test image
        run: |
          docker run -d --name test-container -p 3000:3000 feskillspace:${{ github.sha }}
          sleep 10
          curl -f http://localhost:3000 || (docker logs test-container && exit 1)
          docker stop test-container
