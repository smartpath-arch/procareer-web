services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: feskillspace-web-dev
    restart: unless-stopped
    ports:
      - "3002:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    command: pnpm dev
    networks:
      - feskillspace-network
    stdin_open: true
    tty: true

networks:
  feskillspace-network:
    driver: bridge
