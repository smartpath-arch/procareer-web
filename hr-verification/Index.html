  <script>
    (function () {
      'use strict';

      // How often open pages re-check the sheet. Edits show up within about
      // this interval plus the server cache time (CONFIG.CACHE_SECONDS).
      var REFRESH_MS = window.HR_REFRESH_MS || 60000;
      // Faster retry while nothing has loaded yet.
      var FIRST_LOAD_RETRY_MS = 15000;

      var els = {
        status: document.getElementById('hr-status'),
        loading: document.getElementById('hr-loading'),
        list: document.getElementById('hr-list'),
        message: document.getElementById('hr-message'),
        messageTitle: document.getElementById('hr-message-title'),
        messageText: document.getElementById('hr-message-text')
      };

      var lastSignature = null;  // skips re-rendering when nothing changed
      var hasLoaded = false;     // true after the first successful response
      var inFlight = false;      // prevents overlapping requests
      var timer = null;
      var dueWhileHidden = false;

      function fetchDirectory() {
        if (inFlight) return;
        if (!window.google || !google.script || !google.script.run) {
          onFailure(new Error('google.script.run is not available'));
          return;
        }
        inFlight = true;
        google.script.run
          .withSuccessHandler(onSuccess)
          .withFailureHandler(onFailure)
          .getHRDirectory();
      }

      function onSuccess(data) {
        inFlight = false;
        var contacts = normalize(data);
        var signature = JSON.stringify(contacts);
        if (signature !== lastSignature) {
          render(contacts);
          lastSignature = signature;
        }
        hasLoaded = true;
        setStatus('Diperbarui otomatis setiap menit · terakhir dicek ' + timeNow(), false);
        schedule(REFRESH_MS);
      }

      function onFailure(error) {
        inFlight = false;
        if (window.console) console.warn('HR directory could not be loaded:', error);
        if (hasLoaded) {
          // Keep the last good list on screen; just note the failed refresh.
          setStatus('Gagal memperbarui data. Menampilkan data terakhir yang berhasil dimuat.', true);
          schedule(REFRESH_MS);
        } else {
          els.loading.hidden = true;
          showMessage('error', 'Daftar HR belum dapat dimuat',
            'Silakan coba beberapa saat lagi. Halaman ini akan mencoba memuat ulang secara otomatis.');
          setStatus('', false);
          schedule(FIRST_LOAD_RETRY_MS);
        }
      }

      /* Keeps only well-formed records, whatever the server returned. */
      function normalize(data) {
        if (!Array.isArray(data)) return [];
        var out = [];
        for (var i = 0; i < data.length; i++) {
          var item = data[i] || {};
          var name = typeof item.name === 'string' ? item.name.trim() : '';
          var phone = typeof item.phone === 'string' ? item.phone.trim() : '';
          if (name && phone) out.push({ name: name, phone: formatPhone(phone) });
        }
        return out;
      }

      function render(contacts) {
        els.loading.hidden = true;

        if (contacts.length === 0) {
          els.list.hidden = true;
          els.list.textContent = '';
          showMessage('empty', 'Belum ada kontak HR yang ditampilkan',
            'Daftar HR resmi sedang diperbarui. Silakan kembali lagi nanti.');
          return;
        }

        hideMessage();
        var fragment = document.createDocumentFragment();
        for (var i = 0; i < contacts.length; i++) fragment.appendChild(buildCard(contacts[i]));
        els.list.textContent = '';          // replace, never append: no duplicate cards
        els.list.appendChild(fragment);
        els.list.hidden = false;
      }

      function buildCard(contact) {
        var card = el('li', 'hr-card');
        card.appendChild(el('h3', 'hr-name', contact.name));

        var phone = el('p', 'hr-phone');
        phone.appendChild(el('span', 'sr-only', 'Nomor telepon: '));
        phone.appendChild(document.createTextNode(contact.phone));
        card.appendChild(phone);
        return card;
      }

      /* Add readable Indonesian separators when the sheet stores only digits. */
      function formatPhone(phone) {
        var digits = phone.replace(/\D/g, '');
        if (/^0\d{11}$/.test(digits)) {
          return digits.slice(0, 4) + '-' + digits.slice(4, 8) + '-' + digits.slice(8);
        }
        return phone;
      }

      function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (text) node.textContent = text;
        return node;
      }


      function showMessage(kind, title, text) {
        els.message.classList.toggle('is-error', kind === 'error');
        els.message.setAttribute('role', kind === 'error' ? 'alert' : 'status');
        els.messageTitle.textContent = title;
        els.messageText.textContent = text;
        els.message.hidden = false;
      }

      function hideMessage() {
        els.message.hidden = true;
      }

      function setStatus(text, isWarning) {
        els.status.textContent = text;
        els.status.classList.toggle('is-warning', !!isWarning);
      }

      function timeNow() {
        try {
          return new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        } catch (e) {
          return new Date().toTimeString().slice(0, 5);
        }
      }

      /* Refresh timer. While the tab is hidden, the check waits until the
         visitor comes back, so background tabs don't keep hitting the sheet. */
      function schedule(ms) {
        clearTimeout(timer);
        timer = setTimeout(function () {
          if (document.hidden) {
            dueWhileHidden = true;
          } else {
            fetchDirectory();
          }
        }, ms);
      }

      document.addEventListener('visibilitychange', function () {
        if (!document.hidden && dueWhileHidden) {
          dueWhileHidden = false;
          fetchDirectory();
        }
      });

      fetchDirectory();
    })();
  </script>
</body>
</html>
